# GitLab CI pipeline for merge-request checks and automated releases.
# NOTE: This configuration has not been run on GitLab yet — it documents the intended CI/CD
# workflow and may need tweaks (runner image, signing) before first use.

default:
  image: cernilovsky/android:jdk17
  before_script:
    - export GRADLE_USER_HOME="$CI_PROJECT_DIR/.gradle"
  cache:
    key: gradle-$CI_COMMIT_REF_SLUG
    paths:
      - .gradle/

# Pipelines run on merge requests, pushes to development, and manual "Run pipeline" from the GitLab
# UI (web). Direct pushes to other branches get no pipeline.
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "development"'
    - if: '$CI_PIPELINE_SOURCE == "web"'

stages:
  - lint
  - test
  - build
  - release

# Quality gate for merge requests and on-demand web runs. Pushes to development skip straight to
# the release stage instead of repeating it.
.verify:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "web"'

lint:
  extends: .verify
  stage: lint
  script:
    - ./gradlew lintKotlin detekt :konsist:test
  artifacts:
    when: on_failure
    paths:
      - "**/build/reports/detekt/**"
    reports:
      junit: "konsist/build/test-results/test/*.xml"
    expire_in: 30 days

test:
  extends: .verify
  stage: test
  script:
    # Root-level task (no module prefix) runs unit tests across every module, not just :app.
    - ./gradlew test
  artifacts:
    when: on_failure
    paths:
      - "**/build/test-results/test*UnitTest/*.xml"
    reports:
      junit: "**/build/test-results/test*UnitTest/*.xml"
    expire_in: 30 days

build:
  extends: .verify
  stage: build
  script:
    - ./gradlew :app:assembleDebug
  artifacts:
    paths:
      - app/build/outputs/apk/debug/*.apk
    expire_in: 7 days

# Builds the release APK and derives the release tag from versionName, passing both to
# publish-release via a dotenv artifact.
release:
  stage: release
  rules:
    - if: '$CI_COMMIT_BRANCH == "development"'
  script:
    - ./gradlew :app:assembleRelease
    - VERSION=$(grep 'versionName' app/build.gradle.kts | sed -E 's/.*versionName *= *"([^"]+)".*/\1/')
    - |
      cat <<EOF >> release.env
      TAG=v$VERSION
      RELEASE_JOB_ID=$CI_JOB_ID
      APK_ARTIFACT_PATH=app/build/outputs/apk/release/$(basename "$(ls app/build/outputs/apk/release/app-*.apk | head -1)")
      EOF
  artifacts:
    paths:
      - app/build/outputs/apk/release/*.apk
    reports:
      dotenv: release.env
    expire_in: 30 days

# Links the APK built by the release job as a release asset (no re-upload).
publish-release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  rules:
    - if: '$CI_COMMIT_BRANCH == "development"'
  needs:
    - job: release
      artifacts: true
  script:
    - echo "Publishing $TAG for $CI_COMMIT_SHORT_SHA"
  release:
    tag_name: '$TAG'
    description: 'Automated release $TAG'
    ref: '$CI_COMMIT_SHA'
    assets:
      links:
        - name: 'app-release.apk'
          url: '${CI_PROJECT_URL}/-/jobs/${RELEASE_JOB_ID}/artifacts/raw/${APK_ARTIFACT_PATH}'
